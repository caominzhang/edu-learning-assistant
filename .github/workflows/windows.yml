name: Build Windows preview
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python smoke_test.py
      - run: python -m PyInstaller --noconfirm --clean --onedir --windowed --name EDULearningAssistant --hidden-import app --collect-all PIL --collect-all pytesseract windows_launcher.py
      - uses: actions/upload-artifact@v4
        with:
          name: EDULearningAssistant-Windows-preview
          path: dist/EDULearningAssistant/
